# build settings for netlify

[build]
  publish = "site/public/"

[context.deploy-preview]
  command = 'npm run deploy -- -D'

[context.branch-deploy]
  command = 'npm run deploy -- -D'

[context.production]
  command = 'npm run deploy'

# --- APIプロキシ（Railway） ---
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RAILWAY_APP.up.railway.app/api/:splat"
  status = 200

[[redirects]]
  from = "/eventimages/*"
  to = "https://YOUR_RAILWAY_APP.up.railway.app/eventimages/:splat"
  status = 200

# --- SPAハンドラー ---
[[redirects]]
  from = "/addevent/*"
  to = "/addevent"
  status = 200

[[redirects]]
  from = "/calendar/*"
  to = "/calendar/event"
  status = 200

[[redirects]]
  from = "/events/*"
  to = "/events"
  status = 200
