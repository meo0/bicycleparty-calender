<script type="text/javascript">
  //Mustache delimiter changing: https://stackoverflow.com/questions/13944623/escape-double-braces-in-mustache-template-templating-a-template-in-n
  Mustache.tags = ["[[", "]]"];
</script>

<script id="view-events-template" type="text/template">
  [[#dates]]
  <div data-date="[[yyyymmdd]]" class="date[[#preview]] preview[[/preview]]">
    <h2>[[date]]</h2>

    <ul class="events-list">
      [[#events]]

      <li class="event row [[#cancelled]]cancelled[[/cancelled]] [[#featured]]featured[[/featured]]" data-event-id="[[id]]">
        [[#featured]]<p class="featured-text" id="featured[[caldaily_id]]"><span aria-hidden="true">★ </span>注目イベント<span aria-hidden="true"> ★</span></p>[[/featured]]
        <div class="time col-xs-2">
          [[#cancelled]]<del>[[/cancelled]]

          <p><time>[[displayStartTime]]</time></p>

          [[#audienceLabel]]
          <span class="audience-[[audience]]">[[audienceLabel]]</span>
          [[/audienceLabel]]

          [[#safetyplan]]
          <p class="safety-plan">
            <a href="/pages/public-health/#safety-plan" target="_blank" title="opens in a new window">
              <svg class="icon" role="img" aria-hidden="true">
                <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-safety" }}"/>
              </svg>
              感染症安全対策プラン
            </a>
          </p>
          [[/safetyplan]]

          [[#cancelled]]</del>[[/cancelled]]
        </div>
        <div class="col-xs-10" >
          <div class="summary">
            [[# featured ]]
            [[^ newsflash ]]
            <h3 aria-describedby="featured[[caldaily_id]]">
              [[/ newsflash ]]
              [[/ featured ]]

              [[^ featured ]]
              [[# newsflash ]]
              <h3 aria-describedby="newsflash[[caldaily_id]]">
                [[/ newsflash ]]
                [[/ featured ]]

                [[# featured ]]
                [[# newsflash ]]
                <h3 aria-describedby="featured[[caldaily_id]] newsflash[[caldaily_id]]">
                  [[/ newsflash ]]
                  [[/ featured ]]

                  [[^ featured ]]
                  [[^ newsflash ]]
                  <h3>
                    [[/ newsflash ]]
                    [[/ featured ]]

                    <button type="button" aria-expanded="[[^ expanded ]]false[[/ expanded ]][[# expanded ]]true[[/ expanded ]]" class="expand-details" data-toggle-target="#event-details-[[caldaily_id]]">
                      <svg class="icon expand" role="img" aria-hidden="true">
                        <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-arrow-down" }}"/>
                      </svg>

                      [[#cancelled]]<del>[[/cancelled]]
                      [[title]]

                      [[#cancelled]]
                    </del> <ins><span class="cancelled-text">中止</span></ins>
                      [[/cancelled]]

                    </button>
                  </h3>

                  [[#newsflash]]
                  <ins>
                    <p class="newsflash" id="newsflash[[caldaily_id]]">
                      <svg class="icon" role="img">
                        <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-newsflash" }}"/>
                        <title>更新</title>
                      </svg>
                      [[newsflash]]
                    </p>
                  </ins>
                  [[/newsflash]]

                  [[#cancelled]]<del>[[/cancelled]]

                  <div class="location">
                    [[#areaLabel]]
                    <p class="area">
                      <svg class="icon" role="img">
                        <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-map" }}"/>
                        <title>エリア</title>
                      </svg>
                      [[areaLabel]]
                    </p>
                    [[/areaLabel]]
                    <p>
                      [[#mapLink]]
                      <a href="[[mapLink]]" target="_blank" rel="noopener nofollow external"  title="新しいウィンドウで開きます">
                      [[/mapLink]]
                      <svg class="icon" role="img">
                        <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-location" }}"/>
                        <title>集合場所</title>
                      </svg>
                      [[venue]][[#address]][[#venue]], [[/venue]][[address]][[/address]]

                      [[#mapLink]]
                      </a>
                      [[/mapLink]]
                    </p>

                    [[#locdetails]]
                    <p>[[locdetails]]</p>
                    [[/locdetails]]
                  </div>
                  <p>
                    <svg class="icon" role="img">
                      <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-organizer" }}" />
                      <title>ライドリーダー</title>
                    </svg>
                    [[organizer]]
                  </p>

                  [[#cancelled]]</del>[[/cancelled]]

          </div>
        </div>

        <div class="col-xs-2">
        </div>
        <div class="event-details col-xs-10" id="event-details-[[caldaily_id]]" [[^ expanded ]]hidden[[/ expanded ]] >

        [[#cancelled]]<del>[[/cancelled]]

        <div class="mainDetails">
          <div class="eventImg">
            [[# image]]
            <a href="[[image]]">
              <img class="lazy" src="{{ absURL "img/cal/icons/blank.svg" }}" data-src="[[image]]" alt="[[title]]のアップロード画像" />
            </a>
            [[/ image]]
          </div>

          <div>
            <p>
               <svg class="icon" role="img">
                 <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-time" }}"/>
                 <title>集合時間</title>
               </svg>
              [[displayDate]], [[displayStartTime]]
            </p>

            [[#timedetails]]
            <p>
               <svg class="icon" role="img">
                 <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-newsflash" }}"/>
                 <title>詳細なスケジュール</title>
               </svg>
              [[timedetails]]
            </p>
            [[/timedetails]]

            [[#endtime]]
            <p>
               <svg class="icon" role="img">
                 <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-endtime" }}"/>
                 <title>終了時刻</title>
               </svg>
              [[displayEndTime]]
            </p>
            [[/endtime]]

            [[#loopride]]
            <p>
              <svg class="icon" role="img">
                <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-loop" }}" />
                <title>ループ</title>
              </svg>
              ライドは集合場所に戻ります。
            </p>
            [[/loopride]]

            [[#locend]]
            <p>
              <svg class="icon" role="img">
                <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-endlocation" }}" />
                <title>終了場所</title>
              </svg>
              終了場所: [[locend]]
            </p>
            [[/locend]]

            [[#ridelength]]
            <p>
              <svg class="icon" role="img">
                <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-ridelength" }}" />
                <title>Ride length</title>
              </svg>
              Ride length: [[ridelength]] miles
            </p>
            [[/ridelength]]
          </div>

          <p class="description">[[details]]</p>

          [[#email]]
          <p>
            <a href="mailto:[[email]]">
              <svg class="icon" role="img">
                <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-email" }}" />
                <title>メールアドレス</title>
              </svg>
              [[email]]
            </a>
          </p>
          [[/email]]

          [[#phone]]
          <p class="contactInfo">
            <a href="tel:[[phone]]">
              <svg class="icon" role="img">
                <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-phone" }}" />
                <title>電話番号</title>
              </svg>
              [[phone]]
            </a>
          </p>
          [[/phone]]

          [[ #weburl ]]
          <p class="contactInfo">
            <a href="[[webLink]]" target="_blank" rel="noopener nofollow external" title="新しいウィンドウで開きます">
              <svg class="icon" role="img">
                <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-website" }}" />
                <title>Webサイト</title>
              </svg>
              [[#webname]][[webname]][[/webname]]
              [[^webname]][[weburl]][[/webname]]
            </a>
          </p>
          [[ /weburl ]]

          [[#contact]]

          [[#contactLink]]
          <p class="contactInfo">
            <a href="[[contactLink]]" target="_blank" rel="noopener nofollow external" title="新しいウィンドウで開きます">
              <svg class="icon" role="img">
                <use href="{{ absURL "img/cal/icons/icon-set.svg#icon-website" }}" />
                <title>追加の連絡先</title>
              </svg>
              [[contact]]
            </a>
          </p>
          [[/contactLink]]

          [[^contactLink]]
          <p class="contactInfo">
            [[contact]]
          </p>
          [[/contactLink]]

          [[/contact]]

          <div class="eventlink">
            <p class="facebook-share">
              <a href="https://www.facebook.com/sharer/sharer.php?u=[[shareable]]" target="_blank">
                <img src="{{ absURL "img/cal/icons/facebook.svg" }}" alt="Facebook"/>シェア</a>
            </p>
            <ul>
              <li>
                <a
                  [[^preview]]
                      href="[[shareable]]"
                  [[/preview]]
                  class="share-link"
                  rel="bookmark">
                  リンクのシェア</a>
              </li>
              <li>
                <a
                  [[^preview]]
                      href="[[exportlink]]"
                  [[/preview]]
                  data-id="[[caldaily_id]]"
                  class="export-link">
                  カレンダーにエクスポート</a>
              </li>
              <li>
                <a
                  [[^preview]]
                      href="[[addToGoogleLink]]"
                  [[/preview]]
                  target="_blank"
                  class="export-link">
                  Googleカレンダーエクスポート</a>
              </li>
            </ul>
          </div>
          [[#preview]]
          <hr>
          <p>以下の内容が印刷カレンダーに表示されます。</p>
          <ul>
            <li>タイトル：[[tinytitle]]</li>
            <li>説明：[[printdescr]]</li>
            <li>連絡先：
              <ul>
                <li>[[organizer]]</li>
                [[# printpreviewemail]]<li>[[printpreviewemail]]</li>[[/ printpreviewemail]]
                [[# printpreviewphone]]<li>[[printpreviewphone]]</li>[[/ printpreviewphone]]
                [[# printpreviewweburl]]<li>[[printpreviewweburl]]</li>[[/ printpreviewweburl]]
                [[# printpreviewcontact]]<li>[[printpreviewcontact]]</li>[[/ printpreviewcontact]]
              </ul>
            </li>
          </ul>
          [[/preview]]

          [[#cancelled]]</del>[[/cancelled]]
  </div>
  </li>
  [[/events]]
  </ul>
  </div>
  [[/dates]]

  [[^dates]]
  <p class="no-events">該当するイベントはありません</p>
  [[/dates]]

</script>

<script id="request-error" type="text/template">
  <p class="error">エラー：[[ error ]]</p>
</script>
